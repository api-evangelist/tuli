name: Tuli
description: Tuli Health operates a UK-wide network of over 300 high-street pharmacies
  as local diagnostic hubs, making clinical services - primarily blood testing and
  phlebotomy - accessible in every neighbourhood so people can get care close to home.
  It offers healthcare providers three models - One Network (white-label phlebotomy),
  One Solution (end-to-end test kits, draws and lab analysis), and an Enterprise tier
  with custom integration. Tuli exposes an API and web portal for booking and managing
  tests, though public developer documentation is not yet published.
